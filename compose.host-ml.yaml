services:
  host:
    build:
      target: host-ml
    environment:
      HOST_MODEL_PROFILE: granite-3.3-2b-instruct-host-lora-v1
      HOST_TRAINING_BACKEND: transformers
      HOST_TRAINING_DEVICE: ${HOST_TRAINING_DEVICE:-cuda}
      HOST_TRAINING_PRECISION: ${HOST_TRAINING_PRECISION:-bfloat16}
      HOST_PUBLIC_DATA_EPOCHS: ${HOST_PUBLIC_DATA_EPOCHS:-5}
      HOST_MICRO_BATCH_SIZE: ${HOST_MICRO_BATCH_SIZE:-1}
      HOST_GRADIENT_ACCUMULATION_STEPS: ${HOST_GRADIENT_ACCUMULATION_STEPS:-4}
      HOST_LEARNING_RATE: ${HOST_LEARNING_RATE:-3e-5}
      HOST_WARMUP_RATIO: ${HOST_WARMUP_RATIO:-0.008}
      HOST_DATALOADER_NUM_WORKERS: ${HOST_DATALOADER_NUM_WORKERS:-4}
      HOST_TRAINING_SEED: ${HOST_TRAINING_SEED:-42}
      HOST_GRADIENT_CHECKPOINTING: ${HOST_GRADIENT_CHECKPOINTING:-false}
      HOST_VERIFY_FROZEN_BASE_CHECKSUM: ${HOST_VERIFY_FROZEN_BASE_CHECKSUM:-true}
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface_cache:/models/huggingface
    gpus: all
    shm_size: 2gb
