services:
  host:
    build:
      context: .
      dockerfile: host/Dockerfile
    environment:
      MODEL_BACKEND: ${MODEL_BACKEND:-mock}
      HOST_MODEL_ID: ${HOST_MODEL_ID:-legal-poc-mock}
      LORA_RANK: ${LORA_RANK:-2}
      LORA_TARGET_MODULES: ${LORA_TARGET_MODULES:-q_proj,v_proj}
    ports:
      - "${HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      MODEL_BACKEND: ${MODEL_BACKEND:-mock}
      CLIENT_ID: ${CLIENT_ID:-legal-client-1}
      CLIENT_MODEL_ID: ${CLIENT_MODEL_ID:-legal-poc-mock}
      CLIENT_ADAPTER_POLICY: ${CLIENT_ADAPTER_POLICY:-replace}
      HOST_URL: http://host:8000
      HOST_TIMEOUT_SECONDS: ${HOST_TIMEOUT_SECONDS:-10}
      LORA_RANK: ${LORA_RANK:-2}
      LORA_TARGET_MODULES: ${LORA_TARGET_MODULES:-q_proj,v_proj}
    ports:
      - "${CLIENT_PORT:-8001}:8001"
    depends_on:
      host:
        condition: service_healthy

networks:
  default:
    name: legalfedllm_net
