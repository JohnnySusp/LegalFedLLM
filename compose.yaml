services:
  host:
    build:
      context: .
      dockerfile: host/Dockerfile
    environment:
      HOST_DATA_DIR: /data/host
      HOST_ID: ${HOST_ID:-legalfedllm-host}
      HOST_TRAINING_BACKEND: ${HOST_TRAINING_BACKEND:-mock}
      HOST_SERVING_BACKEND: ${HOST_SERVING_BACKEND:-mock}
      HOST_MODEL_ID: ${HOST_MODEL_ID:-legalfedllm/mock-host}
      HOST_OLLAMA_MODEL: ${HOST_OLLAMA_MODEL:-granite3.3:2b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-development-internal-token}
    expose:
      - "8002"
    volumes:
      - host_data:/data/host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    environment:
      COORDINATOR_DATA_DIR: /data/coordinator
      COORDINATOR_ID: ${COORDINATOR_ID:-legalfedllm-coordinator}
      HOST_RUNTIME_URL: http://host:8002
      HOST_TIMEOUT_SECONDS: ${HOST_TIMEOUT_SECONDS:-60}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-development-internal-token}
      REGISTRATION_TOKEN: ${REGISTRATION_TOKEN:-development-registration-token}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-development-admin-token}
      MAXIMUM_CLOCK_SKEW_SECONDS: ${MAXIMUM_CLOCK_SKEW_SECONDS:-900}
      ROUND_MONITOR_INTERVAL_SECONDS: ${ROUND_MONITOR_INTERVAL_SECONDS:-2}
    ports:
      - "${COORDINATOR_PORT:-8000}:8000"
    volumes:
      - coordinator_data:/data/coordinator
    depends_on:
      host:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: client-ml
    environment:
      CLIENT_DATA_DIR: /data/client
      CLIENT_ID: ${CLIENT_ID:-legal-client-1}
      CLIENT_TRAINING_BACKEND: transformers
      CLIENT_SERVING_BACKEND: ${CLIENT_SERVING_BACKEND:-mock}
      CLIENT_MODEL_ID: ${CLIENT_MODEL_ID:-legalfedllm/mock-client}
      CLIENT_OLLAMA_MODEL: ${CLIENT_OLLAMA_MODEL:-qwen3:1.7b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      COORDINATOR_URL: http://coordinator:8000
      COORDINATOR_TIMEOUT_SECONDS: ${COORDINATOR_TIMEOUT_SECONDS:-60}
      REGISTRATION_TOKEN: ${REGISTRATION_TOKEN:-development-registration-token}
      CLIENT_ADMIN_TOKEN: ${CLIENT_ADMIN_TOKEN:-development-client-admin-token}
      MAXIMUM_CLOCK_SKEW_SECONDS: ${MAXIMUM_CLOCK_SKEW_SECONDS:-900}
      CLIENT_MODEL_PROFILE: ${CLIENT_MODEL_PROFILE:-qwen3-1.7b-lora-v1}
      CLIENT_TRAINING_DEVICE: ${CLIENT_TRAINING_DEVICE:-cuda}
      CLIENT_TRAINING_PRECISION: ${CLIENT_TRAINING_PRECISION:-bfloat16}
      CLIENT_TRAINING_QUANTIZATION: none
      CLIENT_PRIVATE_DATA_PATH: /private/train.jsonl
      CLIENT_PRIVATE_DATASET_ID: ${CLIENT_PRIVATE_DATASET_ID:-client-private-v1}
      CLIENT_MICRO_BATCH_SIZE: ${CLIENT_MICRO_BATCH_SIZE:-1}
      CLIENT_GRADIENT_ACCUMULATION_STEPS: ${CLIENT_GRADIENT_ACCUMULATION_STEPS:-8}
      CLIENT_LEARNING_RATE: ${CLIENT_LEARNING_RATE:-2e-4}
      CLIENT_TRAINING_SEED: ${CLIENT_TRAINING_SEED:-42}
      CLIENT_GRADIENT_CHECKPOINTING: ${CLIENT_GRADIENT_CHECKPOINTING:-false}
      CLIENT_VERIFY_FROZEN_BASE_CHECKSUM: ${CLIENT_VERIFY_FROZEN_BASE_CHECKSUM:-false}
      CLIENT_KNOWLEDGE_BATCH_SIZE: ${CLIENT_KNOWLEDGE_BATCH_SIZE:-1}
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "127.0.0.1:${CLIENT_PORT:-8001}:8001"
    volumes:
      - client_data:/data/client
      - huggingface_cache:/models/huggingface
      - ${CLIENT_PRIVATE_DATA_DIR:-./data/client-private}:/private:ro
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    gpus: all
    shm_size: 2gb

networks:
  default:
    name: legalfedllm_net

volumes:
  coordinator_data:
  host_data:
  client_data:
  huggingface_cache:
