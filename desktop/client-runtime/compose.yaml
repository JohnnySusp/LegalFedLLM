services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${LEGALFEDLLM_CLIENT_IMAGE}
    network_mode: host
    environment:
      CLIENT_DATA_DIR: /data/client
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_TRAINING_BACKEND: transformers
      CLIENT_SERVING_BACKEND: ${CLIENT_SERVING_BACKEND:-transformers}
      CLIENT_MODEL_PROFILE: ${CLIENT_MODEL_PROFILE}
      CLIENT_TRAINING_DEVICE: ${CLIENT_TRAINING_DEVICE:-cuda}
      CLIENT_TRAINING_PRECISION: ${CLIENT_TRAINING_PRECISION:-bfloat16}
      CLIENT_TRAINING_QUANTIZATION: ${CLIENT_TRAINING_QUANTIZATION:-none}
      CLIENT_PRIVATE_DATA_PATH: /private/train.jsonl
      CLIENT_PRIVATE_DATASET_ID: ${CLIENT_PRIVATE_DATASET_ID}
      CLIENT_MICRO_BATCH_SIZE: ${CLIENT_MICRO_BATCH_SIZE:-1}
      CLIENT_GRADIENT_ACCUMULATION_STEPS: ${CLIENT_GRADIENT_ACCUMULATION_STEPS:-8}
      CLIENT_LEARNING_RATE: ${CLIENT_LEARNING_RATE:-2e-4}
      CLIENT_TRAINING_SEED: ${CLIENT_TRAINING_SEED:-42}
      CLIENT_GRADIENT_CHECKPOINTING: ${CLIENT_GRADIENT_CHECKPOINTING:-false}
      CLIENT_VERIFY_FROZEN_BASE_CHECKSUM: ${CLIENT_VERIFY_FROZEN_BASE_CHECKSUM:-false}
      CLIENT_KNOWLEDGE_BATCH_SIZE: ${CLIENT_KNOWLEDGE_BATCH_SIZE:-1}
      CLIENT_FORCE_REVERSE_VALIDATION_FAILURE: ${CLIENT_FORCE_REVERSE_VALIDATION_FAILURE:-false}
      CLIENT_ADMIN_TOKEN: ${CLIENT_ADMIN_TOKEN}
      REGISTRATION_TOKEN: ${REGISTRATION_TOKEN:-}
      MAXIMUM_CLOCK_SKEW_SECONDS: ${MAXIMUM_CLOCK_SKEW_SECONDS:-900}
      COORDINATOR_URL: http://127.0.0.1:${CLIENT_COORDINATOR_LOCAL_PORT}
      COORDINATOR_TIMEOUT_SECONDS: ${COORDINATOR_TIMEOUT_SECONDS:-60}
      COORDINATOR_RECONCILIATION_TIMEOUT_SECONDS: ${COORDINATOR_RECONCILIATION_TIMEOUT_SECONDS:-30}
      COORDINATOR_RECONCILIATION_POLL_SECONDS: ${COORDINATOR_RECONCILIATION_POLL_SECONDS:-1}
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-}
      CLIENT_AGENT_HOST: 127.0.0.1
      CLIENT_AGENT_PORT: ${CLIENT_AGENT_PORT}
      CLIENT_SSH_TUNNEL_ENABLED: "true"
      CLIENT_SSH_TUNNEL_EXTERNAL: "true"
      CLIENT_SSH_EXTERNAL_FORWARD_HOST: 127.0.0.1
      CLIENT_COORDINATOR_LOCAL_PORT: ${CLIENT_COORDINATOR_LOCAL_PORT}
      CLIENT_COORDINATOR_REMOTE_HOST: ${CLIENT_COORDINATOR_REMOTE_HOST:-127.0.0.1}
      CLIENT_COORDINATOR_REMOTE_PORT: ${CLIENT_COORDINATOR_REMOTE_PORT:-8000}
      CLIENT_SSH_TARGET: ${CLIENT_SSH_TARGET:-}
      CLIENT_SSH_PORT: ${CLIENT_SSH_PORT:-22}
    volumes:
      - "${LEGALFEDLLM_CLIENT_DATA_DIR}:/data/client"
      - "${LEGALFEDLLM_PRIVATE_DATA_DIR}:/private"
      - "${LEGALFEDLLM_HF_HOME}:/models/huggingface"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['CLIENT_AGENT_PORT'] + '/health')"
      interval: 5s
      timeout: 3s
      retries: 60
    gpus: all
    shm_size: 2gb
